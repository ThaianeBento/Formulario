<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Cadastro</title>
</head>
<body>

    <div>
        <h1 id="titulo">Cadastro de devs</h1>
        <p id="subtitulo">Complete suas informações</p>
        <br>

    </div>

    <form >
        <fieldset class="grupo">
            <div class="campo">
                <label for="nome"><strong>Nome</strong></label>
                <input type="text" name="nome" id="nome" required>
            </div>

            <div class="campo">
                <Label for="sobrenome"><Strong>Sobrenome</Strong></Label>
                <input type="text" name="sobrenome" id="sobrenome" required>
            </div>

        </fieldset>

        <div class="campo">
            <label for="email"><Strong>Email</Strong></label>
            <input type="email" name="email" id="email" required>
        </div>

        <div class="campo">
            <label><Strong>De qual lado da aplicação você desenvolve?</Strong></label>
            <label >
                <input type="radio" name="devweb" value="frontend" checked> Front-end
            </label>
            <label >
                <input type="radio" name="devweb" value="backend"> Back-end
            </label>
            <label >
                <input type="radio" name="devweb" value="fullstack"> Fullstack
            </label>
        </div>

        <div class="campo">
            <label for="senioridade"><strong>Senioridade</strong></label>
            <select id="senioridade">
                <option selected disabled value="">Selecione</option>
                <option >Estagiário</option>
                <option >Junior</option>
                <option >Pleno</option>
                <option >Senior</option>
            </select>
        </div>

        <fieldset class="fieldset">
            <div id="check">
                <label ><Strong>Selecione as tecnologias que utiliza:</Strong></label><br><br>
                <input type="checkbox" name="tecnologia1" id="tecnologia1" value="HTML"> 
                <label for="tecnologia1">HTML</label>

                <input type="checkbox" name="tecnologia2" id="tecnologia2" value="CSS"> 
                <label for="tecnologia2">CSS</label>

                <input type="checkbox" name="tecnologia3" id="tecnologia3" value="Javascript"> 
                <label for="tecnologia3">JavaScript</label>

                <input type="checkbox" name="tecnologia4" id="tecnologia4" value="Java"> 
                <label for="tecnologia4">Java</label>

                <input type="checkbox" name="tecnologia5" id="tecnologia5" value="Python"> 
                <label for="tecnologia5">Phyton</label>

                <input type="checkbox" name="tecnologia6" id="tecnologia6" value="C#"> 
                <label for="tecnologia6">C#</label>

                <input type="checkbox" name="tecnologia7" id="tecnologia7" value="PHP"> 
                <label for="tecnologia7">PHP</label>
            </div>
        </fieldset>

        <div class="campo">
            <br>
            <label >Conte um pouco da sua experiência:</label>
            <textarea rows="6" style="width: 26em;" id="experiencia" name="experiencia"></textarea>
        </div>

        <button class="botao" type="submit">Enviar</button>
    </form>

</body>
</html>
